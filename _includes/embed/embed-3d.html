{% if include.url contains "http" %} {% assign model_url = include.url %} {%
else %} {% assign model_url = site.baseurl | append: include.url %} {% endif %}
{% assign default_style = "height: 300px; width: 100%; background:
linear-gradient(135deg, #191411 0%, #191411 80%, #2F2E2C 100%);" %}

<script
  type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"
></script>

<model-viewer
  src="{{ model_url }}"
  alt="{{ include.alt | default: '3D model' }}"
  camera-controls
  touch-action="pan-y"
  auto-rotate
  shadow-intensity="1"
  environment-image="neutral"
  class="{{ include.class }}"
  style="{{ default_style }} {{ include.style }}"
>
</model-viewer>
